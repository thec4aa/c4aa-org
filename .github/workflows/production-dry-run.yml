name: Production Mirror Dry Run

# Manual only. Builds exactly like the production deploy, then runs the rsync
# mirror that we intend to switch production to, with --dry-run, so the log
# shows what would be sent and what would be deleted on the server without
# changing anything. Uses the same secrets as main.yml.

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: Production
    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Install npm dependencies
      run: npm ci

    - name: Run build task
      run: npm run prod --if-present

    - name: Grant May First shell access
      uses: baisong/mayfirst-shell-action@v0.1.1
      with:
        comment: "production mirror dry run from GitHub Actions"
        user: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASS }}

    - name: Rsync dry run against production
      # pinned to a commit because this action gets the private key
      uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ARGS: "-rlgoDzvc -i --delete --delete-excluded --dry-run"
        REMOTE_HOST: ${{ secrets.SSH_HOST }}
        REMOTE_USER: ${{ secrets.SSH_USER }}
        REMOTE_PORT: ${{ secrets.SSH_PORT }}
        TARGET: ${{ secrets.REMOTE_TARGET }}
        EXCLUDE: "/node_modules/, /src/, /.git/, /.github/, /.vscode/, /.gitignore, /.nvmrc, /package.json, /package-lock.json, /README.md"
