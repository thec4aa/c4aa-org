name: Production Build/Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_comment:
        description: "Deploy comment"
        required: true

# One production deploy at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Install npm dependencies
      run: npm ci

    - name: Run build task
      run: npm run prod --if-present

    - name: Show Current Directory
      run: pwd

    - name: Check Build Directory
      run: |
        echo "Checking build directory contents..."
        ls -la ./build

    # The copy step below sends ./** so anything left here ends up on the
    # server. The dependencies were only needed to build main.css.
    - name: Drop node_modules before the copy
      run: rm -rf node_modules

    - name: Connect to May First Shell Account
      uses: baisong/mayfirst-shell-action@v0.1.1
      with:
        comment: ${{ inputs.deploy_comment || 'production deploy from GitHub Actions' }}
        user: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASS }}

    - name: Deploy to Server
      uses: nogsantos/ssh-scp-deploy@v1.3.0
      with:
        src: ./**  # Transfer everything inside the build directory
        host: ${{ secrets.SSH_HOST }}
        remote: ${{ secrets.REMOTE_TARGET }}
        user: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}